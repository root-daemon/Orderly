# Free-tier Render blueprint for Orderly API
# Free web services spin down after ~15m idle (cold start ~1m).
services:
  - type: web
    name: orderly-api
    runtime: docker
    plan: free
    region: oregon
    rootDir: server
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: CLIENT_SECRET
        sync: false
      - key: EMAIL
        sync: false
      - key: PASSWORD
        sync: false
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: SERVER_URL
        sync: false
      - key: REDIRECT_URL
        sync: false
      - key: CLIENT_URL
        sync: false
